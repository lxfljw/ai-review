name: AI Code Review (DeepSeek)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          BASE_REF="${{ github.base_ref || 'main' }}"
          DIFF=$(git diff origin/$BASE_REF...HEAD --unified=5)
          DIFF="${DIFF//'%'/%25}"
          DIFF="${DIFF//$'\n'/%0A}"
          DIFF="${DIFF//$'\r'/%0D}"
          echo "diff=$DIFF" >> $GITHUB_OUTPUT

      - name: AI Code Review with DeepSeek
        if: env.DEEPSEEK_API_KEY != ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          BASE_REF="${{ github.base_ref || 'main' }}"
          DIFF=$(git diff origin/$BASE_REF...HEAD)
          
          RESPONSE=$(curl -s https://api.deepseek.com/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
            -d '{
              "model": "deepseek-chat",
              "messages": [
                {
                  "role": "system",
                  "content": "You are a code reviewer. Review the following PR changes and provide constructive feedback. Focus on: bugs, security issues, code quality, performance, and best practices. Output in Chinese."
                },
                {
                  "role": "user",
                  "content": "PR Title: '"$PR_TITLE"'\n\nPR Description: '"$PR_BODY"'\n\nGit Diff:\n'"$DIFF"'"
                }
              ],
              "temperature": 0.3,
              "max_tokens": 4000
            }')
          
          REVIEW=$(echo $RESPONSE | jq -r '.choices[0].message.content')
          echo "$REVIEW" > review.md
          
          # Post comment
          curl -X POST https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"body\": \"## 🤖 AI Code Review\n\n$REVIEW\n\n---\n*Powered by DeepSeek V3*\"}"

      - name: No API Key warning
        if: env.DEEPSEEK_API_KEY == ''
        run: |
          echo "::warning::DEEPSEEK_API_KEY not set. Please add it as a secret to enable AI review."
